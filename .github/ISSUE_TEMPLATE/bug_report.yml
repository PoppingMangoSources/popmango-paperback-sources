name: Bug report
description: Something in a source is broken or behaving oddly.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: source
    attributes:
      label: Source
      description: Which source is affected?
      placeholder: Cocomic
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Source version
      description: Shown next to the source in Paperback's extension list.
      placeholder: 1.0.0
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does it break?
      multiple: true
      options:
        - Home page sections
        - Search
        - Manga details
        - Chapter list
        - Reading a chapter
        - Settings
        - Something else
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the title you were browsing and, if you have one, a link to it.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Paperback version
      placeholder: 0.8.x
    validations:
      required: true
