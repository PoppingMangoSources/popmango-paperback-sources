name: Source request
description: Ask for a new website to be added.
title: "[Request] "
labels: ["source request"]
body:
  - type: input
    id: website
    attributes:
      label: Website
      description: The full URL of the site's front page.
      placeholder: https://example.com
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Language
      placeholder: English
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything worth knowing?
      description: Login walls, region locks, Cloudflare, or anything else that makes the site awkward.
    validations:
      required: false
