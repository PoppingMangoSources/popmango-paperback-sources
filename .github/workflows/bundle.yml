name: Bundle and publish sources

# Publishing workflow for the combined 0.8/0.9 source garden.
on:
  push:
    branches:
      - '**'
      - '!gh-pages'
  workflow_dispatch:

concurrency:
  group: publish-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Resolve the publish folder
        id: folder
        run: |
          branch="${GITHUB_REF#refs/heads/}"
          folder="$(node scripts/publish-folder.mjs "$branch")"
          echo "name=$folder" >> "$GITHUB_OUTPUT"
          echo "Publishing to /$folder"

      - uses: ./.github/actions/setup-paperback

      - name: Check out the published site
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: bundles

      - name: Verify and bundle the sources
        env:
          PUBLISH_FOLDER: ${{ steps.folder.outputs.name }}
        run: npm run verify -- --folder="$PUBLISH_FOLDER"

      - name: Build the repository site
        env:
          PUBLISH_FOLDER: ${{ steps.folder.outputs.name }}
        run: npm run site -- --folder="$PUBLISH_FOLDER"

      - name: Apply site presentation
        env:
          PUBLISH_FOLDER: ${{ steps.folder.outputs.name }}
        run: node scripts/customize-site.mjs --folder="$PUBLISH_FOLDER"

      - name: Preserve the 0.8 compatibility path
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            rm -rf bundles/0.8
            cp -R bundles/all bundles/0.8
          fi

      - name: Publish to GitHub Pages
        env:
          PUBLISH_FOLDER: ${{ steps.folder.outputs.name }}
        run: |
          cd bundles
          rm -rf .git
          git init -q -b gh-pages
          git config user.name "PoppingMangoSources"
          git config user.email "ikjot97@hotmail.com"
          git add -A
          git commit -q -m "Publish bundles for $PUBLISH_FOLDER"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
