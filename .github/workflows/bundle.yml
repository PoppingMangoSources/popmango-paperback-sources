name: Bundle and publish sources

on:
  push:
    branches:
      - '**'
      - '!gh-pages'
  workflow_dispatch:

concurrency:
  group: publish-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Resolve the publish folder
        id: folder
        run: |
          branch="${GITHUB_REF#refs/heads/}"
          case "$branch" in
            main) folder="all" ;;
            *) folder="$(printf '%s' "$branch" | tr '/' '-')" ;;
          esac
          echo "name=$folder" >> "$GITHUB_OUTPUT"
          echo "Publishing to /$folder"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check out the published site
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: bundles

      - name: Bundle the sources
        run: npm run bundle -- --folder=${{ steps.folder.outputs.name }}

      - name: Build the repository site
        run: npm run site -- --folder=${{ steps.folder.outputs.name }}

      # Keep the visual tweaks isolated from extension bundling.
      - name: Apply site presentation
        run: node scripts/customize-site.mjs --folder=${{ steps.folder.outputs.name }}

      - name: Preserve the old 0.8 repository URL
        if: github.ref_name == 'main'
        run: |
          rm -rf bundles/0.8
          cp -R bundles/all bundles/0.8
          cat > bundles/0.8/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="refresh" content="0; url=../all/">
          <link rel="canonical" href="../all/">
          <title>PoppingMango Sources</title>
          </head>
          <body><p>Taking you to <a href="../all/">PoppingMango Sources</a>…</p></body>
          </html>
          HTML

      - name: Publish to GitHub Pages
        run: |
          cd bundles
          rm -rf .git
          git init -q -b gh-pages
          git config user.name "PoppingMangoSources"
          git config user.email "ikjot97@hotmail.com"
          git add -A
          git commit -q -m "Publish bundles for ${{ steps.folder.outputs.name }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
