name: Checks

on:
  push:
    branches:
      - '**'
      - '!gh-pages'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-paperback

      - name: Verify types, regressions, bundles and repository links
        run: npm run verify

      - name: Check whitespace
        run: git diff --check
