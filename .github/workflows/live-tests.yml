name: Live source checks

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
    inputs:
      source:
        description: 'all runs enabled sources; a source name also overrides its exclusion'
        required: true
        default: all
        type: string

permissions:
  contents: read

jobs:
  select:
    name: Select live sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.sources.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Select sources and report exclusions
        id: sources
        env:
          SOURCE_SELECTION: ${{ inputs.source || 'all' }}
        run: node scripts/live-test-matrix.mjs "$SOURCE_SELECTION"

  live:
    name: Live (${{ matrix.source }})
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-paperback
      - name: Verify and bundle
        run: npm run verify
      - name: Run the selected source
        env:
          SOURCE_NAME: ${{ matrix.source }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          npm run test:live -- "$SOURCE_NAME" 2>&1 | tee logs/live-source.log
      - name: Upload live logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paperback-08-live-${{ matrix.source }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
